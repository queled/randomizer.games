name: Sync Racetime Game (Full Recovery)

on:
  workflow_dispatch:
    inputs:
      game_slug:
        description: 'Slug racetime ou ID du jeu à synchroniser (ex: ootr, alttp)'
        required: true
        default: ''
        type: string
      max_pages:
        description: 'Nombre max de pages à récupérer (ex: 100, 500, 99999 pour pas de limite; laisser vide pour défaut 100)'
        required: false
        default: ''
        type: string

env:
  NODE_VERSION: '20'

jobs:
  sync-game:
    name: Sync Game Races
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2h timeout for large game syncs
    
    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4
      
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Installation des dépendances
        run: npm ci
      
      - name: Synchroniser le jeu depuis racetime.gg
        id: sync
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          RACETIME_RATE_LIMIT_MS: ${{ vars.RACETIME_RATE_LIMIT_MS || '' }}
        run: |
          # Déterminer le nombre de pages
          if [[ -n "${{ inputs.max_pages }}" ]]; then
            PAGES="${{ inputs.max_pages }}"
            echo "Mode: Setup personnalisé ($PAGES pages)"
          else
            PAGES="100"
            echo "Mode: Default (100 pages)"
          fi
          
          # Appeler le script de sync
          echo "🎮 Synchronisation du jeu: ${{ inputs.game_slug }} (max $PAGES pages)"
          node scripts/sync-racetime-game.js \
            --game "${{ inputs.game_slug }}" \
            --max-pages "$PAGES" 2>&1 | tee /tmp/sync-output.log
          
          # Extraire les stats du résumé
          NEW_RACES=$(grep -oP 'nouvelles races importées: \K[0-9]+' /tmp/sync-output.log || grep -oP '✓ \K[0-9]+' /tmp/sync-output.log || echo "0")
          UPDATED=$(grep -oP 'races mises à jour' /tmp/sync-output.log | wc -l || echo "0")
          
          echo "new_races=$NEW_RACES" >> $GITHUB_OUTPUT
          echo "updated=$UPDATED" >> $GITHUB_OUTPUT
      
      - name: Résumé de la synchronisation
        if: always()
        run: |
          echo "## ✅ Full Sync Racetime Game" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Game:** ${{ inputs.game_slug }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🆕 Nouvelles races: ${{ steps.sync.outputs.new_races }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🔄 Mises à jour: ${{ steps.sync.outputs.updated }}" >> $GITHUB_STEP_SUMMARY
          echo "- ⏰ Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
