# Workflow: Synchronisation fréquente des races racetime.gg
# Ce workflow récupère les nouvelles courses toutes les 5 minutes (global sync)
# Optimisé pour: détection des nouvelles courses, mises à jour légères, finalisation des courses stuck
# 
# Pour une sync complète d'un jeu spécifique: utilise sync-racetime-game-full.yml
# 
# Étapes:
# 1. Récupère races globales récentes (2 pages)
# 2. Finalise les courses stuck en in_progress depuis >24h
# 3. Rattrape les courses terminées entre deux runs (1/4 des catégories par run)

name: Sync Racetime Races

on:
  # Exécution toutes les 5 minutes
  schedule:
    - cron: '*/5 * * * *'
  
  # Déclenchement manuel (sans paramètres - utilisé pour forcer un sync global maintenant)
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'

# Empêche les exécutions simultanées
concurrency:
  group: sync-races
  cancel-in-progress: false

jobs:
  sync-races:
    name: Synchroniser les races
    runs-on: ubuntu-latest
    # Timeout conditionnel: 10min pour le schedule, 6h pour les runs manuels
    timeout-minutes: ${{ github.event_name == 'schedule' && 10 || 360 }}
    
    steps:
      - name: Checkout du projet
        uses: actions/checkout@v7
      
      - name: Configuration de Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Installation des dépendances
        run: npm ci
      
      - name: Récupérer les races depuis racetime.gg
        id: sync
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          RACETIME_RATE_LIMIT_MS: ${{ vars.RACETIME_RATE_LIMIT_MS }}
        run: |
          # Script optimisé: 1 appel API global + finalize races stuck
          # Doit terminer en < 5 minutes
          node scripts/sync-racetime-global.js 2>&1 | tee /tmp/sync-output.log
          
          # Extraire les stats du résumé
          NEW_RACES=$(grep -oP 'Nouvelles races: \K[0-9]+' /tmp/sync-output.log || echo "0")
          UPDATED=$(grep -oP 'Mises à jour: \K[0-9]+' /tmp/sync-output.log || echo "0")
          FINALIZED=$(grep -oP 'Finalisées: \K[0-9]+' /tmp/sync-output.log || echo "0")
          ERRORS=$(grep -oP 'Erreurs: \K[0-9]+' /tmp/sync-output.log || echo "0")
          
          echo "new_races=$NEW_RACES" >> $GITHUB_OUTPUT
          echo "updated=$UPDATED" >> $GITHUB_OUTPUT
          echo "finalized=$FINALIZED" >> $GITHUB_OUTPUT
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
      
      - name: Résumé de la synchronisation
        if: always()
        run: |
          echo "## ✅ Synchronisation Racetime" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🆕 Nouvelles races: ${{ steps.sync.outputs.new_races }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🔄 Mises à jour: ${{ steps.sync.outputs.updated }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🔧 Finalisées: ${{ steps.sync.outputs.finalized }}" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Erreurs: ${{ steps.sync.outputs.errors }}" >> $GITHUB_STEP_SUMMARY
          echo "- ⏰ Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
