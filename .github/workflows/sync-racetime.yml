# Workflow: Synchronisation fréquente des races racetime.gg
# Ce workflow récupère les nouvelles courses toutes les 5 minutes
# FIXE: Ajoute la finalisation systématique des courses stuck en in_progress (>24h)
# 
# Étapes:
# 1. Récupère races globales récentes (2 pages)
# 2. Récupère aussi les premières pages par catégorie pour courses intermédiaires
# 3. Finalise agressivement les courses stuck en in_progress depuis >24h

name: Sync Racetime Races

on:
  # Exécution toutes les 5 minutes
  schedule:
    - cron: '*/5 * * * *'
  
  # Déclenchement manuel
  workflow_dispatch:
    inputs:
      game_slug:
        description: 'Slug racetime du jeu à synchroniser (laisser vide pour global)'
        required: false
        default: ''
        type: string
      max_pages:
        description: 'Nombre max de pages à récupérer (laisser vide pour illimité si game_slug fourni)'
        required: false
        default: ''
        type: string
      no_limit:
        description: 'Pas de limite de pages (pour sync complète d un jeu)'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '20'

# Empêche les exécutions simultanées
concurrency:
  group: sync-races
  cancel-in-progress: false

jobs:
  sync-races:
    name: Synchroniser les races
    runs-on: ubuntu-latest
    # Timeout conditionnel: 10min pour le schedule, 6h pour les runs manuels
    timeout-minutes: ${{ github.event_name == 'schedule' && 10 || 360 }}
    
    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4
      
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Installation des dépendances
        run: npm ci
      
      - name: Récupérer les races depuis racetime.gg
        id: sync
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          RACETIME_RATE_LIMIT_MS: ${{ vars.RACETIME_RATE_LIMIT_MS || '1500' }}
        run: |
          # Mode par défaut: sync rapide (2 pages globales + 5 pages/catégorie + finalize)
          # Ajoute --full pour un scan plus profond
          node scripts/sync-racetime-global.js 2>&1 | tee /tmp/sync-output.log
          
          # Extraire les stats
          GLOBAL_NEW=$(grep -oP 'API Globale: \K[0-9]+' /tmp/sync-output.log | head -1 || echo "0")
          GLOBAL_UPD=$(grep -oP 'API Globale:.*\K[0-9]+(?= màj)' /tmp/sync-output.log || echo "0")
          CATEGORY_NEW=$(grep -oP 'Par catégorie: \K[0-9]+' /tmp/sync-output.log || echo "0")
          FINALIZED=$(grep -oP 'Finalisées: \K[0-9]+' /tmp/sync-output.log || echo "0")
          
          echo "global_new=$GLOBAL_NEW" >> $GITHUB_OUTPUT
          echo "global_upd=$GLOBAL_UPD" >> $GITHUB_OUTPUT
          echo "category_new=$CATEGORY_NEW" >> $GITHUB_OUTPUT
          echo "finalized=$FINALIZED" >> $GITHUB_OUTPUT
      
      - name: Résumé de la synchronisation
        if: always()
        run: |
          echo "## ✅ Synchronisation Racetime" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🆕 Nouvelles (API Globale): ${{ steps.sync.outputs.global_new }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🔄 Mises à jour (API Globale): ${{ steps.sync.outputs.global_upd }}" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Nouvelles (Par catégorie): ${{ steps.sync.outputs.category_new }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🔧 Finalisées (stuck races): ${{ steps.sync.outputs.finalized }}" >> $GITHUB_STEP_SUMMARY
          echo "- ⏰ Date: $(date -u)" >> $GITHUB_STEP_SUMMARY

  # Job optionnel pour détecter automatiquement de nouvelles catégories racetime
  detect-new-categories:
    name: Détecter nouvelles catégories
    runs-on: ubuntu-latest
    # N'exécute qu'une fois par heure (au cron minute 0)
    if: github.event.schedule && contains(github.event.schedule, '0 * * * *')
    
    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4
      
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Installation des dépendances
        run: npm ci
      
      - name: Vérifier les nouvelles catégories
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          node scripts/detect-new-racetime-categories.js || true
