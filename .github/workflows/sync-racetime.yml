# Workflow: Synchronisation fréquente des races racetime.gg
# Ce workflow récupère les nouvelles courses toutes les 5 minutes
# en partant des races globales récentes (plus efficace que jeu par jeu)

name: Sync Racetime Races

on:
  # Exécution toutes les 5 minutes
  schedule:
    - cron: '*/5 * * * *'
  
  # Déclenchement manuel
  workflow_dispatch:
    inputs:
      game_slug:
        description: 'Slug racetime du jeu à synchroniser (laisser vide pour global)'
        required: false
        default: ''
        type: string
      max_pages:
        description: 'Nombre max de pages à récupérer (laisser vide pour illimité si game_slug fourni)'
        required: false
        default: ''
        type: string
      no_limit:
        description: 'Pas de limite de pages (pour sync complète d un jeu)'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '20'

# Empêche les exécutions simultanées
concurrency:
  group: sync-races
  cancel-in-progress: false

jobs:
  sync-races:
    name: Synchroniser les races
    runs-on: ubuntu-latest
    # Timeout conditionnel: 10min pour le schedule, 6h pour les runs manuels
    timeout-minutes: ${{ github.event_name == 'schedule' && 10 || 360 }}
    
    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4
      
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Installation des dépendances
        run: npm ci
      
      - name: Récupérer les races depuis racetime.gg
        id: sync
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          RACETIME_RATE_LIMIT_MS: ${{ vars.RACETIME_RATE_LIMIT_MS || '1500' }}
        run: |
          GAME_SLUG="${{ github.event.inputs.game_slug }}"
          MAX_PAGES="${{ github.event.inputs.max_pages }}"
          NO_LIMIT="${{ github.event.inputs.no_limit }}"
          
          ARGS=""
          
          if [ -n "$GAME_SLUG" ]; then
            # Sync d'un jeu spécifique
            ARGS="--game $GAME_SLUG"
            
            if [ "$NO_LIMIT" = "true" ]; then
              ARGS="$ARGS --no-limit"
            elif [ -n "$MAX_PAGES" ]; then
              ARGS="$ARGS --max-pages $MAX_PAGES"
            fi
          else
            # Sync globale (races récentes)
            if [ -n "$MAX_PAGES" ]; then
              ARGS="--max-pages $MAX_PAGES"
            else
              ARGS="--max-pages 2"
            fi
          fi
          
          # Utilise le nouveau script global
          node scripts/sync-racetime-global.js $ARGS 2>&1 | tee /tmp/sync-output.log
          
          # Si c'est une sync d'un jeu complet (plus de 5 pages ou --no-limit), finaliser les anciennes races
          if [ -n "$GAME_SLUG" ] && ([ "$NO_LIMIT" = "true" ] || ([ -n "$MAX_PAGES" ] && [ "$MAX_PAGES" -gt 5 ])); then
            echo ""
            echo "🔧 Finalisation des races en cours anciennes..."
            node scripts/sync-racetime-finalize.js --max-age 30d --limit 500 2>&1 | tee -a /tmp/sync-output.log || true
          fi
          
          # Extraire les stats
          NEW_RACES=$(grep -oP 'Nouvelles races: \K\d+' /tmp/sync-output.log || echo "0")
          UPDATED_RACES=$(grep -oP 'Mises à jour: \K\d+' /tmp/sync-output.log || echo "0")
          
          echo "new_races=$NEW_RACES" >> $GITHUB_OUTPUT
          echo "updated_races=$UPDATED_RACES" >> $GITHUB_OUTPUT
      
      - name: Résumé de la synchronisation
        if: steps.sync.outputs.new_races != '0' || steps.sync.outputs.updated_races != '0'
        run: |
          echo "## Synchronisation racetime.gg" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🆕 Nouvelles races: ${{ steps.sync.outputs.new_races }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🔄 Mises à jour: ${{ steps.sync.outputs.updated_races }}" >> $GITHUB_STEP_SUMMARY
          echo "- ⏰ Date: $(date -u)" >> $GITHUB_STEP_SUMMARY

  # Job optionnel pour détecter automatiquement de nouvelles catégories racetime
  detect-new-categories:
    name: Détecter nouvelles catégories
    runs-on: ubuntu-latest
    # N'exécute qu'une fois par heure (au cron minute 0)
    if: github.event.schedule && contains(github.event.schedule, '0 * * * *')
    
    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4
      
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Installation des dépendances
        run: npm ci
      
      - name: Vérifier les nouvelles catégories
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          node scripts/detect-new-racetime-categories.js || true
