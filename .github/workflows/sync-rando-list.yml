# Workflow: Synchronisation quotidienne avec rando-list
# Ce workflow vérifie si de nouveaux jeux ont été ajoutés au repo video-game-randomizers/rando-list
# et met à jour le cache en BDD + récupère les races pour les nouveaux jeux

name: Sync Rando-List

on:
  # Exécution quotidienne à 6h00 UTC (7h00 Paris en hiver, 8h00 en été)
  schedule:
    - cron: '0 6 * * *'
  
  # Déclenchement manuel depuis l'interface GitHub
  workflow_dispatch:
    inputs:
      force_full_sync:
        description: 'Force une synchronisation complète de tous les jeux'
        required: false
        default: 'false'
        type: boolean
      link_games:
        description: 'Lier automatiquement les jeux existants aux entrées rando-list'
        required: false
        default: 'true'
        type: boolean
      sync_races:
        description: 'Synchroniser les races pour les nouveaux jeux détectés'
        required: false
        default: 'true'
        type: boolean

  # Optionnel: Webhook depuis le repo rando-list (nécessite configuration du repo source)
  repository_dispatch:
    types: [rando-list-updated]

env:
  NODE_VERSION: '20'

jobs:
  check-changes:
    name: Vérifier les changements dans rando-list
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      new_games: ${{ steps.check.outputs.new_games }}
      commit_hash: ${{ steps.check.outputs.commit_hash }}
    
    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4
      
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Installation des dépendances
        run: npm ci
      
      - name: Cloner le repo rando-list
        run: |
          git clone --depth 1 https://github.com/video-game-randomizers/rando-list.git /tmp/rando-list
      
      - name: Vérifier les changements rando-list
        id: check
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          RANDO_LIST_DIR: /tmp/rando-list
        run: |
          COMMIT_HASH=$(git -C /tmp/rando-list rev-parse HEAD)
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          
          # Exécute le script de vérification (stdout only pour JSON)
          node scripts/check-rando-list-changes.js --commit $COMMIT_HASH > /tmp/changes.json 2>/tmp/changes.err || {
            echo "⚠️  Script check-rando-list-changes.js failed:"
            cat /tmp/changes.err || echo "(no error output)"
            echo "Defaulting to hasChanges=true"
            echo '{"hasChanges":true,"newGames":[]}' > /tmp/changes.json
          }
          
          # Valider et parser le JSON
          if [ -f /tmp/changes.json ] && [ -s /tmp/changes.json ]; then
            if jq empty /tmp/changes.json 2>/dev/null; then
              HAS_CHANGES=$(jq -r '.hasChanges // "true"' /tmp/changes.json)
              NEW_GAMES=$(jq -c '.newGames // []' /tmp/changes.json)
              echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
              echo "new_games=$NEW_GAMES" >> $GITHUB_OUTPUT
            else
              echo "❌ Invalid JSON in changes.json, using defaults"
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "new_games=[]" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ No changes.json file or empty, using defaults"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "new_games=[]" >> $GITHUB_OUTPUT
          fi

  sync-cache:
    name: Synchroniser le cache rando-list
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true' || github.event.inputs.force_full_sync == 'true'
    runs-on: ubuntu-latest
    outputs:
      new_games_count: ${{ steps.sync.outputs.new_games_count }}
    
    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4
      
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Installation des dépendances
        run: npm ci
      
      - name: Synchroniser avec rando-list
        id: sync
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          RANDO_LIST_DIR: /tmp/rando-list
        run: |
          # Clone le repo
          git clone --depth 1 https://github.com/video-game-randomizers/rando-list.git /tmp/rando-list
          
          # Exécute la synchronisation (mise à jour des ressources + détection des nouveaux jeux)
          npm run sync-rando-list:detect > /tmp/sync-output.log 2>&1 || {
            echo "⚠️ Sync script had issues:"
            cat /tmp/sync-output.log
            exit 1
          }
          
          cat /tmp/sync-output.log
          
          # Extraire le nombre de nouveaux jeux du JSON de résultat
          if grep -q "SYNC_RESULTS_JSON" /tmp/sync-output.log; then
            RESULTS=$(sed -n '/--- SYNC_RESULTS_JSON ---/,/--- END_SYNC_RESULTS_JSON ---/p' /tmp/sync-output.log | grep -v "^---")
            NEW_GAMES_COUNT=$(echo "$RESULTS" | jq -r '.newGamesCount // 0' 2>/dev/null || echo "0")
            echo "new_games_count=$NEW_GAMES_COUNT" >> $GITHUB_OUTPUT
          else
            echo "new_games_count=0" >> $GITHUB_OUTPUT
          fi
      
      - name: Résumé de la synchronisation
        run: |
          echo "## Synchronisation rando-list terminée" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ needs.check-changes.outputs.commit_hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- Nouveaux jeux détectés: ${{ steps.sync.outputs.new_games_count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 Les nouveaux jeux doivent être importés manuellement avec un ID approprié." >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notification
    needs: [sync-cache]
    if: always() && needs.sync-cache.result == 'failure'
    runs-on: ubuntu-latest
    
    steps:
      - name: Notification d'erreur
        run: |
          echo "::error::La synchronisation a échoué. Vérifiez les logs."
          # Optionnel: Ajouter ici une notification Discord/Slack/Email
          # curl -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} -H "Content-Type: application/json" \
          #   -d '{"content": "⚠️ Sync rando-list échouée!"}'
