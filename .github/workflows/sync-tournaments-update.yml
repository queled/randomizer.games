# Workflow: Mise à jour des tournois en cours (start.gg + Challonge)
# Ce workflow re-récupère les données des tournois actifs (pending, underway, in_progress)
# toutes les 15 minutes pour mettre à jour leur statut, participants, résultats.
# Les tournois terminés (complete, ended) sont ignorés automatiquement.
#
# Similaire à sync-racetime.yml mais pour les tournois start.gg et Challonge.

name: Sync Tournaments (Update Active)

on:
  # Exécution toutes les 15 minutes
  schedule:
    - cron: '*/15 * * * *'

  # Déclenchement manuel
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Mode dry-run (aperçu sans modification)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'

# Empêche les exécutions simultanées
concurrency:
  group: sync-tournaments-update
  cancel-in-progress: false

jobs:
  update-active-tournaments:
    name: Mettre à jour les tournois actifs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Mettre à jour les tournois en cours
        id: sync
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          STARTGG_API_TOKEN: ${{ secrets.STARTGG_API_TOKEN }}
          CHALLONGE_API_KEY: ${{ secrets.CHALLONGE_API_KEY }}
        run: |
          DRY_RUN_FLAG=""
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          node scripts/sync-tournaments.js --update-only $DRY_RUN_FLAG 2>&1 | tee /tmp/sync-output.log

          # Extraire les stats du résumé
          extract_single_value() {
            local pattern="$1"
            local fallback="$2"
            local value
            value=$(grep -oP "$pattern" /tmp/sync-output.log | tail -n 1 | tr -d '\r\n' || true)
            if [[ -z "$value" ]]; then
              value="$fallback"
            fi
            echo "$value"
          }

          UPDATED=$(extract_single_value 'Mis à jour: \K[0-9]+' '0')
          SKIPPED=$(extract_single_value 'Ignorés: \K[0-9]+' '0')
          ERRORS=$(extract_single_value 'Erreurs: \K[0-9]+' '0')

          echo "updated=$UPDATED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT

      - name: Résumé de la synchronisation
        if: always()
        run: |
          echo "## 🏆 Mise à jour des tournois actifs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🔄 Mis à jour: ${{ steps.sync.outputs.updated }}" >> $GITHUB_STEP_SUMMARY
          echo "- ⏭️ Ignorés: ${{ steps.sync.outputs.skipped }}" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Erreurs: ${{ steps.sync.outputs.errors }}" >> $GITHUB_STEP_SUMMARY
          echo "- ⏰ Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "- 🔍 **Mode DRY-RUN**" >> $GITHUB_STEP_SUMMARY
          fi
