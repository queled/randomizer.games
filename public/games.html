<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-page-title="games.pageTitle">Games - Randomizer</title>
    <script defer src="/js/seo.js"></script>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    
    <!-- Language initialization to prevent flicker -->
    <style>
        body { opacity: 0; transition: opacity 0.1s ease-in; }
        body.i18n-ready { opacity: 1; }
    </style>
    <script src="/js/i18n-boot.js"></script>
    <script src="/js/ui-events.js"></script>
    
    <!-- Load translations early in head (async to not block parsing) -->
    <script async src="/js/i18n/en.js"></script>
    <script async src="/js/i18n/fr.js"></script>
    <script async src="/js/i18n/es.js"></script>
    <script async src="/js/i18n/de.js"></script>
    <script async src="/js/i18n/it.js"></script>
    <script async src="/js/i18n/pt.js"></script>
    <script async src="/js/i18n.js"></script>
</head>
<body>

    <header>
        <a href="/"><img src="/assets/favicon.png" alt="Randomizer" class="site-logo">Randomizer</a>
        <button class="mobile-menu-toggle" aria-label="Menu" data-menu-toggle>
            <span></span><span></span><span></span>
        </button>
        <nav>
            <ul>
                <li><a href="/games.html" class="nav-active" data-i18n="nav.games"></a></li>
                <li><a href="/races.html" data-i18n="nav.races"></a></li>
                <li><a href="/tournaments.html" data-i18n="nav.tournaments"></a></li>
                <li><a href="/players.html" data-i18n="nav.players"></a></li>
            </ul>
        </nav>
        <div class="flex-grow"></div>
        <input type="text" id="search" placeholder="Search..." data-i18n-placeholder="nav.search">
    </header>

    <main>
        <div class="games-controls">
            <input type="search" id="games-filter" class="games-filter" placeholder="Search a game or a randomizer..." data-i18n-placeholder="games.searchPlaceholder" aria-label="Search a game or a randomizer" autocomplete="off">
            <div class="sort-container" style="display: flex; align-items: center; gap: 0.5rem;">
                <label for="sort-select" data-i18n="games.sortBy" style="color: #9ca3af; font-size: 0.9rem;">Sort by:</label>
                <select id="sort-select" style="background: #374151; color: #f3f4f6; border: 1px solid #4b5563; border-radius: 8px; padding: 0.5rem 1rem; font-size: 0.9rem; cursor: pointer;">
                    <option value="name-asc" data-i18n="games.sortName">Name</option>
                    <option value="streamers-desc" selected data-i18n="games.sortStreamersMost">Most active streamers</option>
                    <option value="streamers-asc" data-i18n="games.sortStreamersLeast">Least active streamers</option>
                    <option value="viewers-desc" data-i18n="games.sortViewersMost">Most viewers</option>
                    <option value="viewers-asc" data-i18n="games.sortViewersLeast">Least viewers</option>
                    <option value="races-desc" data-i18n="games.sortRacesMost">Most races</option>
                    <option value="races-asc" data-i18n="games.sortRacesLeast">Least races</option>
                    <option value="tournaments-desc" data-i18n="games.sortTournamentsMost">Most tournaments</option>
                    <option value="tournaments-asc" data-i18n="games.sortTournamentsLeast">Least tournaments</option>
                    <option value="release-desc" data-i18n="games.sortReleaseNewest">Newest release</option>
                    <option value="release-asc" data-i18n="games.sortReleaseOldest">Oldest release</option>
                </select>
            </div>
        </div>
        <div class="games-legend">
            <span id="games-count"></span>
            <span class="games-legend-keys">
                <span>🏁 <span data-i18n="games.legendRaces">races</span></span>
                <span>🏆 <span data-i18n="games.legendTournaments">tournaments</span></span>
                <span>📺 <span data-i18n="games.legendLive">live streams</span></span>
            </span>
        </div>
        <div id="games-grid"></div>
    </main>

    <script src="/js/spoiler-mode.js"></script>
    <script src="/js/global-search.js"></script>
    <script src="/js/games.js"></script>
    <script src="/js/footer.js"></script>
</body>
</html>
