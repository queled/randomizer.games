<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-page-title="players.pageTitle">Players - Randomizer</title>
    <script defer src="/js/seo.js"></script>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    
    <!-- Language initialization to prevent flicker -->
    <style>
        body { opacity: 0; transition: opacity 0.1s ease-in; }
        body.i18n-ready { opacity: 1; }
    </style>
    <script src="/js/i18n-boot.js"></script>
    <script src="/js/ui-events.js"></script>
    
    <!-- Load translations early in head (async to not block parsing) -->
    <script async src="/js/i18n/en.js"></script>
    <script async src="/js/i18n/fr.js"></script>
    <script async src="/js/i18n/es.js"></script>
    <script async src="/js/i18n/de.js"></script>
    <script async src="/js/i18n/it.js"></script>
    <script async src="/js/i18n/pt.js"></script>
    <script async src="/js/i18n.js"></script>
</head>
<body>

    <header>
        <a href="/"><img src="/assets/favicon.png" alt="Randomizer" class="site-logo">Randomizer</a>
        <button class="mobile-menu-toggle" aria-label="Menu" data-menu-toggle>
            <span></span><span></span><span></span>
        </button>
        <nav>
            <ul>
                <li><a href="/games.html" data-i18n="nav.games">🎮 Games</a></li>
                <li><a href="/races.html" data-i18n="nav.races">🥇 Races</a></li>
                <li><a href="/tournaments.html" data-i18n="nav.tournaments">🏆 Tournaments</a></li>
                <li><a href="/players.html" class="nav-active" data-i18n="nav.players">👤 Players</a></li>
            </ul>
        </nav>
        <div class="flex-grow"></div>
        <input type="text" id="search" placeholder="Search..." data-i18n-placeholder="nav.search">
    </header>

    <main>
        <div class="players-controls" style="display: flex; justify-content: center; margin-bottom: 1.5rem; padding: 0 1rem;">
            <div class="search-container" style="position: relative; width: 100%; max-width: 400px;">
                <input type="text" id="player-search" 
                       data-i18n-placeholder="players.searchPlaceholder" 
                       placeholder="Search players..." 
                       style="width: 100%; background: #374151; color: #f3f4f6; border: 1px solid #4b5563; border-radius: 8px; padding: 0.75rem 1rem 0.75rem 2.5rem; font-size: 1rem;">
                <span style="position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: #9ca3af; pointer-events: none;">🔍</span>
            </div>
        </div>
        <div id="players-list"></div>
    </main>

    <script src="/js/spoiler-mode.js"></script>
    <script src="/js/global-search.js"></script>
    <script src="/js/players.js"></script>
    <script src="/js/footer.js"></script>
</body>
</html>
