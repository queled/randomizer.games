<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-page-title="raceDetail.pageTitle">Race - Randomizer</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  
  <!-- Language initialization to prevent flicker -->
  <style>
    body { opacity: 0; transition: opacity 0.1s ease-in; }
    body.i18n-ready { opacity: 1; }
  </style>
  <script>
    (function() {
      try {
        // Get saved language or detect from browser
        let lang = localStorage.getItem('preferred-language');
        if (!lang) {
          const browserLang = (navigator.language || navigator.userLanguage || 'en').split('-')[0].toLowerCase();
          const supported = ['en', 'fr', 'es', 'de', 'it', 'pt'];
          lang = supported.includes(browserLang) ? browserLang : 'en';
        }
        // Apply language immediately to prevent flicker
        document.documentElement.lang = lang;
        
        // Fallback: show page after 200ms if i18n hasn't marked it ready yet
        window.__i18nShowTimeout = setTimeout(() => {
          if (document.body && !document.body.classList.contains('i18n-ready')) {
            document.body.classList.add('i18n-ready');
          }
        }, 50);
      } catch (e) {
        document.documentElement.lang = 'en';
        if (document.body) document.body.classList.add('i18n-ready');
      }
    })();
  </script>
  
  <!-- Load translations early in head (async to not block parsing) -->
  <script async src="/js/i18n/en.js"></script>
  <script async src="/js/i18n/fr.js"></script>
  <script async src="/js/i18n/es.js"></script>
  <script async src="/js/i18n/de.js"></script>
  <script async src="/js/i18n/it.js"></script>
  <script async src="/js/i18n/pt.js"></script>
  <script async src="/js/i18n.js"></script>
</head>
<body>
  <header>
    <a href="/"><img src="/assets/favicon.png" alt="Randomizer" class="site-logo">Randomizer</a>
    <button class="mobile-menu-toggle" aria-label="Menu" onclick="this.classList.toggle('open');document.querySelector('nav').classList.toggle('open');">
        <span></span><span></span><span></span>
    </button>
    <nav>
      <ul>
        <li><a href="/games.html" data-i18n="nav.games">🎮 Games</a></li>
        <li><a href="/races.html" class="nav-active" data-i18n="nav.races">🥇 Races</a></li>
        <li><a href="/tournaments.html" data-i18n="nav.tournaments">🏆 Tournaments</a></li>
        <li><a href="/players.html" data-i18n="nav.players">👤 Players</a></li>
      </ul>
    </nav>
    <div class="flex-grow"></div>
    <input type="text" id="search" placeholder="Search..." data-i18n-placeholder="nav.search">
  </header>

  <main class="main-container detail-page">
    <!-- Header with race info -->
    <div id="race-header" class="detail-card">
      <div class="race-title-row">
        <div>
          <h1 id="race-game" data-i18n="common.loading">Loading...</h1>
          <p id="race-goal" class="race-goal"></p>
        </div>
        <span id="race-status" class="status-badge"></span>
      </div>
      
      <div id="race-info" class="text-muted race-info-text"></div>
      
      <div class="info-grid race-stats-grid">
        <div class="info-card">
          <div class="info-label" data-i18n="raceDetail.start">📅 Start</div>
          <div id="race-start" class="info-value">-</div>
        </div>
        <div class="info-card">
          <div class="info-label" data-i18n="raceDetail.end">🏁 End</div>
          <div id="race-end" class="info-value">-</div>
        </div>
        <div class="info-card">
          <div class="info-label" data-i18n="raceDetail.duration">⏱️ Duration</div>
          <div id="race-duration" class="info-value">-</div>
        </div>
        <div class="info-card">
          <div class="info-label" data-i18n="raceDetail.participants">👥 Participants</div>
          <div id="race-entrants-count" class="info-value">-</div>
        </div>
      </div>
      
      <div id="race-links" class="race-links"></div>
    </div>

    <!-- Tournament link if associated -->
    <div id="tournament-link" class="tournament-link-card">
      <span class="text-muted" data-i18n="raceDetail.partOfTournament">🏆 This race is part of the tournament: </span>
      <a id="tournament-name" href="#"></a>
    </div>

    <!-- Participants table -->
    <div class="detail-card">
      <h2 id="participants-title" data-i18n="raceDetail.ranking">🏅 Ranking</h2>
      <div id="participants-list"></div>
    </div>
  </main>

  <script src="/js/spoiler-mode.js"></script>
  <script src="/js/global-search.js"></script>
  <script src="/js/race-detail.js"></script>
  <script src="/js/footer.js"></script>
</body>
</html>
