<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-page-title="streams.pageTitle">Streams - Randomizer</title>
    <script defer src="/js/seo.js"></script>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icon-512.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    
    <!-- Language initialization to prevent flicker -->
    <style>
        body { opacity: 0; transition: opacity 0.1s ease-in; }
        body.i18n-ready { opacity: 1; }
    </style>
    <script src="/js/i18n-boot.js"></script>
    <script src="/js/ui-events.js"></script>
    
    <!-- English (fallback) here; i18n-boot.js adds the visitor's language -->
    <script async src="/js/i18n/en.js"></script>
    <script async src="/js/i18n.js"></script>
</head>
<body>

    <header>
        <a href="/"><img src="/assets/favicon.png" alt="Randomizer" class="site-logo">Randomizer</a>
        <button class="mobile-menu-toggle" aria-label="Menu" data-menu-toggle>
            <span></span><span></span><span></span>
        </button>
        <nav>
            <ul>
                <li><a href="/games.html" data-i18n="nav.games">🎮 Games</a></li>
                <li><a href="/races.html" data-i18n="nav.races">🏁 Races</a></li>
                <li><a href="/tournaments.html" data-i18n="nav.tournaments">🏆 Tournaments</a></li>
                <li><a href="/players.html" data-i18n="nav.players">👤 Players</a></li>
                <li><a href="/streams.html" class="nav-active" data-i18n="nav.live">📺 Live</a></li>
            </ul>
        </nav>
        <div class="flex-grow"></div>
        <input type="text" id="search" placeholder="Search..." data-i18n-placeholder="nav.search">
    </header>

    <main class="main-container">
        <h1 data-i18n="streams.title">📺 Live Streams</h1>
        <p class="text-muted page-subtitle" data-i18n="streams.subtitle"></p>

        <!-- Filters -->
        <div class="filter-row">
            <select id="filter-game" class="filter-select">
                <option value="" data-i18n="streams.allGames">All games</option>
            </select>
            <div style="flex: 1;"></div>
            <span id="stream-count" class="text-muted stream-count" data-i18n="common.loading"></span>
        </div>

        <!-- Streams Grid -->
        <div id="streams-grid" class="streams-grid">
            <div class="loading" data-i18n="streams.loadingStreams"></div>
        </div>

        <!-- No streams message -->
        <div id="no-streams" class="no-streams" style="display: none;">
            <p class="no-streams-emoji">😴</p>
            <p class="no-streams-title" data-i18n="streams.noStreams"></p>
            <p class="no-streams-subtitle" data-i18n-html="streams.checkRaces">Come back later or check the <a href="/races.html">ongoing races</a></p>
        </div>
    </main>

    <script src="/js/spoiler-mode.js"></script>
    <script src="/js/global-search.js"></script>
    <script src="/js/streams.js"></script>
    <script src="/js/footer.js"></script>
</body>
</html>
